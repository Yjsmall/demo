[workspace]
name = "context-reader"
version = "0.1.0"
description = "Reproducible development tools for Context Reader"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
cmake = ">=3.28,<4"
ninja = ">=1.12,<2"
nodejs = ">=24,<25"

[target.win-64.activation]
scripts = ["scripts/activate-msys2.bat"]

[tasks]
toolchain-check = "pwsh -NoProfile -File scripts/check-p0-toolchain.ps1"
configure = "cmake --fresh --preset dev-ucrt64"
build = { cmd = "cmake --build --preset dev-ucrt64", depends-on = ["configure"] }
test = { cmd = "ctest --preset dev-ucrt64", depends-on = ["build"] }
node-install = "pwsh -NoProfile -File scripts/ensure-node-dependencies.ps1"
node-build = { cmd = "npm run native:build", depends-on = ["node-install"] }
node-import-check = { cmd = "pwsh -NoProfile -File scripts/check-node-imports.ps1", depends-on = ["node-build"] }
electron-smoke = { cmd = "npm run smoke:electron", depends-on = ["node-import-check"] }
p0 = { depends-on = ["toolchain-check", "test", "electron-smoke"] }
mupdf-prepare = "pwsh -NoProfile -File scripts/prepare-mupdf.ps1"
fixture-verify = "node scripts/verify-pdf-fixtures.cjs"
p1-configure = { cmd = "cmake --fresh --preset p1-ucrt64", depends-on = ["mupdf-prepare"] }
p1-build = { cmd = "cmake --build --preset p1-ucrt64", depends-on = ["p1-configure"] }
p1-test = { cmd = "ctest --preset p1-ucrt64", depends-on = ["p1-build"] }
probe = { cmd = "build\\p1-ucrt64\\tools\\reader-probe.exe", depends-on = ["p1-build"] }
p1 = { depends-on = ["toolchain-check", "fixture-verify", "p1-test"] }
p2-configure = { cmd = "cmake --fresh --preset p2-ucrt64", depends-on = ["mupdf-prepare"] }
p2-build = { cmd = "cmake --build --preset p2-ucrt64", depends-on = ["p2-configure"] }
p2-test = { cmd = "ctest --preset p2-ucrt64", depends-on = ["p2-build"] }
p2-node-build = { cmd = "npm run native:build:p2", depends-on = ["node-install", "mupdf-prepare"] }
p2-node-import-check = { cmd = "pwsh -NoProfile -File scripts/check-node-imports.ps1 -BuildDirectory build/node-p2-ucrt64", depends-on = ["p2-node-build"] }
p2-electron-smoke = { cmd = "npm run smoke:electron:p2", depends-on = ["p2-node-import-check", "fixture-verify"] }
p2-renderer-smoke = { cmd = "npm run smoke:electron:renderer", depends-on = ["p2-node-import-check", "fixture-verify"] }
p2 = { depends-on = ["toolchain-check", "fixture-verify", "p2-test", "p2-electron-smoke", "p2-renderer-smoke"] }
workspace = { cmd = "build\\p2-ucrt64\\tools\\reader-workspace.exe", depends-on = ["p2-build"] }
p3-single-instance-smoke = { cmd = "npm run smoke:electron:single-instance", depends-on = ["p2-node-import-check"] }
p3-utility-restart-smoke = { cmd = "npm run smoke:electron:utility-restart", depends-on = ["p2-node-import-check"] }
p3-node-contract = { cmd = "npm run test:node-contract:p3", depends-on = ["p2-node-import-check"] }
p3-boundary-contract = { cmd = "pwsh -NoProfile -File scripts/check-boundary-contract.ps1 -FacadeTool build/p2-ucrt64/tools/reader-facade-contract.exe -FixturePath tests/corpus/generated/basic-rotated-cropbox.pdf -OutputRoot build/p3-boundary-contract", depends-on = ["p2-build", "p2-node-import-check"] }
p3-replay = { cmd = "pwsh -NoProfile -File scripts/check-reader-replay.ps1 -TracePath tests/replay/cancel-render.jsonl -OutputRoot build/p3-replay", depends-on = ["p2-node-import-check"] }
p3 = { depends-on = ["p2", "p3-single-instance-smoke", "p3-utility-restart-smoke", "p3-node-contract", "p3-boundary-contract", "p3-replay"] }
renderer-build = "npm run build:renderer"
p4-1 = { depends-on = ["p2-test", "p2-node-build", "renderer-build"] }
p4-2 = { depends-on = ["p2-test", "p3-node-contract"] }
p4-3 = { depends-on = ["p2-test", "renderer-build"] }
p4-benchmark-smoke = { cmd = "build\\p2-ucrt64\\tools\\reader-bench.exe --smoke tests\\corpus\\generated\\basic-rotated-cropbox.pdf build\\p4-bench.json", depends-on = ["p2-build"] }
p4-4 = { depends-on = ["p4-benchmark-smoke", "p3-replay"] }
p4-package = { cmd = "npm run package", depends-on = ["p2-node-build", "renderer-build"] }
p4-packaged-smoke = { cmd = "npm run smoke:package", depends-on = ["p4-package"] }
p4-make = { cmd = "npm run make:reuse-package", depends-on = ["p4-packaged-smoke"] }
p4-package-check = { cmd = "pwsh -NoProfile -File scripts/check-p4-package.ps1", depends-on = ["p4-make"] }
p4-release-pack = { cmd = "npm run reader-pack", depends-on = ["p4-package-check", "p4-benchmark-smoke"] }
p4-5 = { depends-on = ["p4-release-pack"] }
p4 = { depends-on = ["p3", "p4-1", "p4-2", "p4-3", "p4-4", "p4-5"] }
